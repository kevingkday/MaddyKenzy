name: review
# Nightly: scorecard, reviews for games played since their last review, playbook rethinks when due.
# On demand: the grown-ups "Review recent play" button (via /api/review) or Run workflow below.
# Reviews only save suggestions; parents apply them from the grown-ups screen.
# Everything goes through the site's private API: no play data or notes land in this repo or its logs.
on:
  schedule:
    - cron: '17 10 * * *'   # 10:17 UTC = about 3am in BC / Yukon
  repository_dispatch:
    types: [review]
  workflow_dispatch:
    inputs:
      family: { description: 'Family id (empty = daily run for all)', default: '' }
      game: { description: Game id, default: itsy-big-show }
permissions:
  contents: read
concurrency: review-${{ github.event.client_payload.family || inputs.family || 'daily' }}-${{ github.event.client_payload.game || inputs.game || 'all' }}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FAMILY: ${{ github.event.client_payload.family || inputs.family }}
      GAME: ${{ github.event.client_payload.game || inputs.game }}
      RUN: ${{ github.event.client_payload.run || '' }}
      KIND: ${{ github.event.client_payload.kind || 'review' }}
      MANUAL: ${{ github.event_name != 'schedule' && (github.event.client_payload.family || inputs.family) && 'true' || 'false' }}
      SITE_URL: ${{ secrets.SITE_URL }}
      INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ vars.MODEL }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Daily review of all played games
        if: env.MANUAL != 'true'
        run: node scripts/daily.mjs
      - name: Check inputs
        if: env.MANUAL == 'true'
        run: |
          [[ "$FAMILY" =~ ^[A-Za-z0-9_-]+$ && "$GAME" =~ ^[a-z0-9-]+$ && -f "site/games/$GAME/game.json" ]] || { echo "Unknown family or game"; exit 1; }
      - name: Scorecard
        if: env.MANUAL == 'true'
        run: node scripts/scorecard.mjs
      - name: Rethink the playbook
        if: env.MANUAL == 'true' && env.KIND == 'meta'
        env: { FORCE: '1' }
        run: node scripts/meta.mjs
      - id: rev
        if: env.MANUAL == 'true' && env.KIND != 'meta'
        run: node scripts/improve.mjs
      - name: Safety checks
        if: steps.rev.outputs.changed == 'true'
        run: node scripts/test.mjs
      - name: Save suggestion for the parent
        if: steps.rev.outputs.changed == 'true'
        run: node scripts/publish.mjs
      - name: Voice clips for the suggestion
        if: steps.rev.outputs.changed == 'true'
        continue-on-error: true
        run: CONFIG_FILE=.candidate.json node scripts/voice.mjs
      - name: Report failure
        if: failure() && env.MANUAL == 'true'
        run: node scripts/fail.mjs
