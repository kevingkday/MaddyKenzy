name: voice
# Makes spoken clips in a family's ElevenLabs voice. Run by hand from the Actions tab:
# "sample" makes a handful of lines to listen to; "all" makes every line the game can say.
# The nightly review also tops up clips automatically.
on:
  workflow_dispatch:
    inputs:
      family: { description: Family id, default: maddykenzy }
      mode: { type: choice, options: [sample, all], default: sample }
permissions:
  contents: read
concurrency: voice-${{ inputs.family }}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FAMILY: ${{ inputs.family }}
      MODE: ${{ inputs.mode }}
      SITE_URL: ${{ secrets.SITE_URL }}
      INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/voice.mjs
