<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Itsy's Big Show</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itsy Show">
<meta name="theme-color" content="#2b1d6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful and loud, like a kids' TV show
   IDEA: a picture-book garden with a water spout, hosted by Itsy the spider
   PICTURE: Itsy climbing the spout on the side rail; every right answer plays a mini-show of the song
   COLOUR and TYPE: sky #8fdcff, grass #58c96a, sun #ffd23f, Itsy purple #6b3fd1, pink #ff4f9a; Baloo 2
   LAYOUT: one task per screen, three huge answer buttons, press-and-hold to leave */
:root{color-scheme:light;--sky:#8fdcff;--sky2:#e4f7ff;--grass:#58c96a;--sun:#ffd23f;--purple:#6b3fd1;--deep:#2b1d6b;--pink:#ff4f9a;--ink:#1d1540}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{background:linear-gradient(var(--sky2),var(--sky));color:var(--ink);font:600 20px/1.2 'Baloo 2',ui-rounded,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;display:none;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.screen.on{display:flex}
.ground{position:absolute;left:0;right:0;bottom:0;height:9vh;background:var(--grass);border-top:8px solid #43b356;pointer-events:none}
/* start */
#start{flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
#start svg{width:min(42vh,60vw);height:min(42vh,60vw);animation:bob 2.4s ease-in-out infinite}
#start h1{font:800 clamp(48px,8vh,88px)/1 'Baloo 2',sans-serif;margin:0;color:var(--deep)}
.big{background:var(--pink);color:#fff;font-weight:800;font-size:clamp(34px,5vh,52px);padding:.35em 1.4em;border-radius:999px;border-bottom:10px solid #c92c73;z-index:2}
.big:active{transform:translateY(6px);border-bottom-width:4px}
@keyframes bob{50%{transform:translateY(-14px) rotate(-3deg)}}
/* intro */
#intro{position:absolute;inset:0;z-index:90;display:none;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#3b2a8f,#0b0820 70%)}
#intro.on{display:grid}
.beams{position:absolute;inset:0;display:grid;place-items:center}
.beams i{position:absolute;width:160vmax;height:7vmin;border-radius:99px;transform:rotate(var(--r)) scaleX(0);opacity:0;filter:blur(1px)}
.play .beams i{animation:beam 2.4s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
@keyframes beam{0%{transform:rotate(var(--r)) scaleX(0);opacity:0}25%{opacity:.95}60%{transform:rotate(calc(var(--r) + 25deg)) scaleX(1);opacity:.8}100%{transform:rotate(calc(var(--r) + 40deg)) scaleX(1.1);opacity:0}}
.drop{position:absolute;top:0;left:50%;width:22vmin;margin-left:-11vmin;transform:translateY(-120%)}
.drop .th{width:3px;height:22vh;background:#fff;margin:0 auto;opacity:.8}
.drop svg{width:22vmin;height:22vmin;display:block}
.play .drop{animation:drop 1.1s cubic-bezier(.3,1.6,.5,1) .15s forwards}
@keyframes drop{to{transform:translateY(0)}}
.ttl{position:relative;text-align:center;color:#fff;opacity:0;transform:scale(2.8);filter:blur(14px);margin-top:16vh}
.ttl b{display:block;font:800 clamp(64px,13vmin,150px)/.95 'Baloo 2',sans-serif;background:linear-gradient(90deg,var(--sun),#fff,var(--pink),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,210,63,.7))}
.ttl span{display:block;font-size:clamp(28px,4.5vmin,48px);opacity:0}
.play .ttl{animation:zoom .7s cubic-bezier(.2,.9,.2,1.1) 1.25s forwards}
.play .ttl span{animation:fade .5s 2.1s forwards}
@keyframes zoom{to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes fade{to{opacity:1}}
#intro.out{animation:fadeout .5s forwards}@keyframes fadeout{to{opacity:0}}
/* home */
#home{flex-direction:column;gap:2.2vh}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;z-index:2}
.hd h1{margin:0;font:800 clamp(36px,5.5vh,60px)/1 'Baloo 2',sans-serif;color:var(--deep);display:flex;align-items:center;gap:12px}
.hd h1 svg{width:1.3em;height:1.3em}
.stars{background:#fff;border-radius:999px;padding:6px 22px;font-size:clamp(28px,4vh,40px);font-weight:800;color:#e0a100;white-space:nowrap;box-shadow:0 4px 0 #0001}
.tiles{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:2.2vh;z-index:2}
.tile{border-radius:34px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;border-bottom:12px solid #0003;text-shadow:0 3px 0 #0002;padding:12px}
.tile:active{transform:translateY(8px);border-bottom-width:4px}
.tile .g{font:800 clamp(56px,10vh,110px)/1 'Baloo 2',sans-serif;letter-spacing:.02em}
.tile .l{font-size:clamp(24px,3.6vh,38px);font-weight:800}
.tile.wide{grid-column:span 2}
.t1{background:var(--purple)}.t2{background:#ff6b4a}.t3{background:#14a874}.t4{background:var(--pink)}.t5{background:#f5a300}
.lvl{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;color:var(--deep);z-index:2}
.lvl button{background:#fff;border-radius:999px;padding:8px 18px;min-height:44px;opacity:.6}
.lvl button.sel{opacity:1;background:var(--deep);color:#fff}
/* game */
#game{gap:18px}
.rail{width:clamp(80px,9vw,120px);position:relative;flex:none;z-index:2}
.pipe{position:absolute;left:50%;top:4%;bottom:7%;width:46%;transform:translateX(-50%);border-radius:14px 14px 6px 6px;background:linear-gradient(90deg,#7f8ca3,#eef3fa 45%,#8592a8)}
.pipe::before{content:'';position:absolute;top:-10px;left:-14%;right:-14%;height:26px;border-radius:10px;background:linear-gradient(90deg,#6f7c93,#dfe6f0 45%,#77849b)}
.notch{position:absolute;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#bfe9ff;border:3px solid #fff}
.notch.got{background:var(--sun)}
.ritsy{position:absolute;left:50%;width:120%;margin-left:-60%;transition:bottom 1.2s cubic-bezier(.4,1.4,.6,1)}
.ritsy svg{width:100%;height:auto;display:block}
.main{flex:1;display:flex;flex-direction:column;gap:2vh;z-index:2}
.top{display:flex;align-items:center;gap:16px}
.top h2{flex:1;margin:0;font:800 clamp(30px,4.5vh,48px)/1 'Baloo 2',sans-serif;color:var(--deep)}
.hold{position:relative;width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 5px 0 #0002}
.hold svg.ic{width:40px;height:40px}
.hold .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:var(--pink);stroke-width:7;stroke-dasharray:226;stroke-dashoffset:226}
.holding .ring circle{transition:stroke-dashoffset .9s linear;stroke-dashoffset:0}
.hold small{position:absolute;bottom:-24px;font-size:15px;color:var(--deep);opacity:.7;white-space:nowrap}
.spk{width:84px;height:84px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none;box-shadow:0 6px 0 #d4a400}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 #d4a400}
.spk svg{width:48px;height:48px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:#ffffffa8;border-radius:36px;padding:2vh 2vw;position:relative;overflow:hidden}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2vw;margin-bottom:9vh}
.ch{background:#fff;border-radius:30px;min-height:clamp(110px,18vh,180px);font:800 clamp(60px,10vh,110px)/1 'Baloo 2',sans-serif;border-bottom:12px solid #cfc6f2;color:var(--ink);display:flex;align-items:center;justify-content:center}
.ch span{display:flex;align-items:baseline;gap:.08em;pointer-events:none}
.ch small{font-size:.7em;opacity:.75}
.ch:active{transform:translateY(8px);border-bottom-width:4px}
.ch.right{background:var(--grass);color:#fff;border-color:#3a9e4b;animation:pop .5s}
.ch.wrong{animation:shake .45s;opacity:.3}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.beads{display:flex;align-items:center;gap:clamp(10px,2.4vw,34px);position:relative;padding:10px}
.beads::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;background:#d9d2f5;border-radius:4px}
.bead{position:relative;width:clamp(96px,15vh,150px);aspect-ratio:1;border-radius:50%;background:#fff;border:8px solid var(--purple);display:grid;place-items:center;font:800 clamp(52px,9vh,90px)/1 'Baloo 2',sans-serif;color:var(--deep)}
.bead.q{border-style:dashed;border-color:var(--pink);color:var(--pink);animation:pulse 1.2s infinite}
.bead.q.done{border-style:solid;animation:pop .5s;background:#fff3a8}
@keyframes pulse{50%{transform:scale(1.07)}}
.dir{font-size:clamp(26px,3.6vh,36px);color:var(--purple);font-weight:800}
.eq{font:800 clamp(64px,11vh,120px)/1 'Baloo 2',sans-serif;color:var(--deep);white-space:nowrap}
.eq .q{color:var(--pink)}
.eq .k{display:inline-block}
.eq.zero .k{animation:pulse .8s 3;color:#f5a300}
.web{display:grid;grid-template-columns:repeat(5,clamp(54px,8vh,84px));gap:12px;justify-content:center;min-height:clamp(54px,8vh,84px)}
.web svg{width:100%;height:auto}
.web .in{animation:flyin 1s cubic-bezier(.3,1.3,.5,1)}
.web .out{animation:flyout 1s ease-in forwards}
@keyframes flyin{from{transform:translate(40vw,-30vh) rotate(200deg)}}
@keyframes flyout{to{transform:translate(40vw,-40vh) rotate(-200deg);opacity:0}}
.pic{font-size:clamp(120px,22vh,210px);line-height:1}
.word{font:800 clamp(48px,8vh,80px)/1 'Baloo 2',sans-serif;color:var(--deep);min-height:1em}
.word b{color:var(--pink)}
.ask{font:800 clamp(40px,7vh,70px)/1.05 'Baloo 2',sans-serif;color:var(--deep);text-align:center}
.ask .spkbig{width:clamp(110px,18vh,170px);height:clamp(110px,18vh,170px);margin:2vh auto 0}
/* board */
#board{flex-direction:column;gap:2vh}
.card{display:flex;align-items:center;justify-content:center;gap:4vw;background:#fff;border-radius:34px;min-height:22vh;padding:1vh 3vw;z-index:2}
.card b{font:800 clamp(90px,16vh,160px)/1 'Baloo 2',sans-serif;color:var(--purple)}
.card .pic{font-size:clamp(90px,15vh,150px)}
.card .word{font-size:clamp(44px,7vh,72px)}
.card .cap{font:800 clamp(38px,6vh,64px)/1.05 'Baloo 2',sans-serif;color:var(--pink);text-align:center}
.letters{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(76px,9vw,110px),1fr));gap:12px;align-content:start;margin-bottom:9vh;z-index:2}
.lt{aspect-ratio:1;max-height:13vh;width:100%;border-radius:22px;color:#fff;font:800 clamp(46px,7vh,70px)/1 'Baloo 2',sans-serif;border-bottom:8px solid #0003;transition:transform .15s}
.lt.lit{transform:scale(1.18) rotate(-4deg);background:var(--sun)!important;color:var(--ink)}
.pill{background:var(--pink);color:#fff;border-radius:999px;padding:12px 28px;font-weight:800;font-size:clamp(26px,3.6vh,36px);border-bottom:8px solid #c92c73;white-space:nowrap}
.pill:active{transform:translateY(5px);border-bottom-width:3px}
.pill:disabled{opacity:.5}
/* show (song scene) */
.overlay{position:absolute;inset:0;z-index:60;display:none}
.overlay.on{display:block}
#show{background:linear-gradient(#bfeaff,var(--sky))}
.sun{position:absolute;right:8vw;top:6vh;width:20vmin;height:20vmin;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2vmin #ffe58a,0 0 0 4vmin #fff3c4;transform:translateY(130%) scale(.4);opacity:0;transition:transform 1.4s cubic-bezier(.3,1.4,.5,1),opacity .6s}
.sun.up{transform:none;opacity:1;animation:spin 8s linear infinite}
@keyframes spin{to{rotate:360deg}}
.rain{position:absolute;inset:0;opacity:0;transition:opacity .5s;background:#5b6d8f33}
.rain.on{opacity:1}
.rain i{position:absolute;top:-30px;width:5px;height:28px;border-radius:4px;background:#2f7fd8;animation:fall .7s linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.bigpipe{position:absolute;left:34vw;bottom:9vh;height:76vh;width:9vmin;border-radius:18px 18px 6px 6px;background:linear-gradient(90deg,#7f8ca3,#eef3fa 45%,#8592a8)}
.bigpipe::before{content:'';position:absolute;top:-14px;left:-30%;right:-30%;height:5vmin;border-radius:14px;background:linear-gradient(90deg,#6f7c93,#dfe6f0 45%,#77849b)}
.climber{position:absolute;left:calc(34vw + 6vmin);bottom:10vh;width:20vmin}
.climber svg{width:100%;height:auto;display:block}
.climber.wig svg{animation:wig .35s ease-in-out infinite alternate}
.climber.happy svg{animation:bob 1s ease-in-out infinite}
@keyframes wig{to{transform:rotate(8deg) translateY(-4px)}}
.lyric{position:absolute;left:4vw;right:4vw;bottom:12vh;margin:0;text-align:center;background:#fff;border-radius:28px;padding:1.2vh 2vw;font:800 clamp(32px,5.4vh,56px)/1.15 'Baloo 2',sans-serif;color:var(--deep);box-shadow:0 8px 0 #0002}
.lyric .w{display:inline-block;transition:transform .2s,color .2s;margin:0 .12em}
.lyric .w.now{color:var(--pink);transform:scale(1.15) translateY(-4px)}
/* party */
#party{background:#2b1d6bdd;display:none;place-items:center;text-align:center;color:#fff;overflow:hidden}
#party.on{display:grid}
#party h2{font:800 clamp(60px,11vh,120px)/1 'Baloo 2',sans-serif;margin:0 0 1vh;color:var(--sun)}
#party p{font-size:clamp(30px,4.5vh,46px);margin:0 0 4vh}
#party .row{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
#party svg.pi{width:28vh;height:28vh;animation:bob 1s ease-in-out infinite}
.conf{position:absolute;top:-4vh;width:16px;height:26px;border-radius:4px;animation:conf 3s linear infinite}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:820px) and (orientation:portrait){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.wide{grid-column:span 2}.t4{grid-column:span 1}.letters{grid-template-columns:repeat(6,minmax(0,1fr));align-content:center}.lt{max-height:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <defs>
  <symbol id="itsy" viewBox="0 0 120 120">
   <g fill="none" stroke="#3a1f86" stroke-width="6" stroke-linecap="round">
    <path d="M36 64Q16 46 6 58"/><path d="M33 72Q10 66 3 80"/><path d="M34 81Q13 88 9 104"/><path d="M41 89Q29 104 27 116"/>
    <path d="M84 64Q104 46 114 58"/><path d="M87 72Q110 66 117 80"/><path d="M86 81Q107 88 111 104"/><path d="M79 89Q91 104 93 116"/>
   </g>
   <ellipse cx="60" cy="72" rx="31" ry="27" fill="#6b3fd1"/>
   <ellipse cx="52" cy="58" rx="14" ry="8" fill="#8b66e6"/>
   <circle cx="48" cy="66" r="10" fill="#fff"/><circle cx="72" cy="66" r="10" fill="#fff"/>
   <circle cx="50" cy="68" r="5.5" fill="#1d1540"/><circle cx="74" cy="68" r="5.5" fill="#1d1540"/>
   <circle cx="52" cy="66" r="1.8" fill="#fff"/><circle cx="76" cy="66" r="1.8" fill="#fff"/>
   <circle cx="39" cy="81" r="5" fill="#ff7ab8" opacity=".7"/><circle cx="81" cy="81" r="5" fill="#ff7ab8" opacity=".7"/>
   <path d="M51 83Q60 92 69 83" fill="none" stroke="#1d1540" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="bug" viewBox="0 0 60 60">
   <circle cx="30" cy="15" r="9" fill="#1d1540"/><circle cx="26" cy="13" r="2.5" fill="#fff"/><circle cx="34" cy="13" r="2.5" fill="#fff"/>
   <circle cx="30" cy="35" r="20" fill="#ff4b4b"/><path d="M30 16V55" stroke="#1d1540" stroke-width="2.5"/>
   <circle cx="21" cy="30" r="4" fill="#1d1540"/><circle cx="39" cy="30" r="4" fill="#1d1540"/><circle cx="22" cy="43" r="3.5" fill="#1d1540"/><circle cx="38" cy="43" r="3.5" fill="#1d1540"/>
   <ellipse cx="22" cy="24" rx="5" ry="3" fill="#fff" opacity=".45"/>
  </symbol>
  <symbol id="spk" viewBox="0 0 48 48"><path d="M8 18h8l11-9v30l-11-9H8z" fill="#1d1540"/><path d="M32 17q5 7 0 14M37 12q9 12 0 24" fill="none" stroke="#1d1540" stroke-width="4" stroke-linecap="round"/></symbol>
  <symbol id="house" viewBox="0 0 48 48"><path d="M6 23 24 8l18 15M11 20v19h26V20" fill="none" stroke="#1d1540" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="28" width="8" height="11" fill="#1d1540"/></symbol>
 </defs>
</svg>

<section id="start" class="screen on">
 <svg viewBox="0 0 120 120"><use href="#itsy"/></svg>
 <h1>Itsy's Big Show</h1>
 <button class="big" id="go">Tap to play!</button>
 <div class="ground"></div>
</section>

<div id="intro">
 <div class="beams" id="beams"></div>
 <div class="drop"><div class="th"></div><svg viewBox="0 0 120 120"><use href="#itsy"/></svg></div>
 <div class="ttl"><b>Itsy's Big Show</b><span>starring… YOU!</span></div>
</div>

<section id="home" class="screen">
 <div class="hd">
  <h1 id="replay"><svg viewBox="0 0 120 120"><use href="#itsy"/></svg>Itsy's Big Show</h1>
  <div class="stars" id="stars">★ 0</div>
 </div>
 <div class="tiles">
  <button class="tile t1" data-go="seq"><span class="g">1 2 ?</span><span class="l">Spider Climb</span></button>
  <button class="tile t2" data-go="bugs"><span class="g">4+1</span><span class="l">Ladybug Friends</span></button>
  <button class="tile t3" data-go="letters"><span class="g">Aa</span><span class="l">Letter Sounds</span></button>
  <button class="tile t4" data-go="board"><span class="g">ABC</span><span class="l">ABC Board</span></button>
  <button class="tile t5 wide" data-go="sing"><span class="g">♪ ♫ ♪</span><span class="l">Sing with Itsy</span></button>
 </div>
 <div class="lvl">Numbers up to <button data-max="10">10</button><button data-max="20">20</button></div>
 <div class="ground"></div>
</section>

<section id="game" class="screen">
 <div class="rail" id="rail"><div class="pipe"></div></div>
 <div class="main">
  <div class="top">
   <button class="hold" id="gHome" aria-label="Hold for home"><svg class="ic"><use href="#house"/></svg><svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/></svg><small>hold</small></button>
   <h2 id="gTitle"></h2>
   <button class="spk" id="again" aria-label="Hear it again"><svg><use href="#spk"/></svg></button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="choices" id="choices"></div>
 </div>
 <div class="ground"></div>
</section>

<section id="board" class="screen">
 <div class="top">
  <button class="hold" id="bHome" aria-label="Hold for home"><svg class="ic"><use href="#house"/></svg><svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/></svg><small>hold</small></button>
  <h2>Tap a letter!</h2>
  <button class="pill" id="abcSing">♪ Sing ABCs</button>
 </div>
 <div class="card" id="card"><span class="cap">Tap any letter to hear it</span></div>
 <div class="letters" id="letters"></div>
 <div class="ground"></div>
</section>

<div id="show" class="overlay">
 <div class="sun" id="sun"></div>
 <div class="rain" id="rain"></div>
 <div class="bigpipe"></div>
 <div class="climber" id="climber"><svg viewBox="0 0 120 120"><use href="#itsy"/></svg></div>
 <div class="ground"></div>
 <p class="lyric" id="lyric"></p>
</div>

<div id="party" class="overlay">
 <div id="confetti"></div>
 <div>
  <svg class="pi" viewBox="0 0 120 120"><use href="#itsy"/></svg>
  <h2>You did it!</h2>
  <p>You earned a star ★</p>
  <div class="row"><button class="big" id="pAgain">Play again</button><button class="big" id="pHome" style="background:var(--purple);border-color:#4a2a9e">Home</button></div>
 </div>
</div>

<script>
{
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const any=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const store={stars:0,max:10};
try{Object.assign(store,JSON.parse(localStorage.getItem('itsy')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('itsy',JSON.stringify(store))}catch(e){}};

/* ---------- sound ---------- */
let ctx,master;
function audio(){
 if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.9;const c=ctx.createDynamicsCompressor();master.connect(c);c.connect(ctx.destination)}
 if(ctx.state!=='running')ctx.resume();return ctx;
}
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const hz=n=>{const m=n.match(/^([A-G])(#?)(\d)$/);return 440*2**((12*(+m[3]+1)+SEMI[m[1]]+(m[2]?1:0)-69)/12)};
function tone(f,t,d,{type='triangle',vol=.22,attack=.012}={}){
 const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0008,t+Math.max(d,.08)+.25);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.4);
}
const bell=(n,t,d,vol=.22)=>{const f=hz(n);tone(f,t,d,{vol});tone(f*2,t,d*.6,{type:'sine',vol:vol*.25})};
const parse=s=>s.split(',').map(x=>{const[n,d]=x.trim().split(' ');return[n,+d]});
function playNotes(notes,unit,bass){
 audio();const t0=ctx.currentTime+.06;let t=t0;
 for(const[n,d]of notes){bell(n,t,d*unit*.9);t+=d*unit}
 if(bass){let b=t0;for(const[n,d]of bass){tone(hz(n),b,d*unit*.95,{type:'sine',vol:.2});b+=d*unit}}
 return t-t0;
}
const yay=()=>{audio();const t=ctx.currentTime+.02;['C6','E6','G6','C7'].forEach((n,i)=>tone(hz(n),t+i*.07,.18,{type:'sine',vol:.16}))};
const oops=()=>{audio();const t=ctx.currentTime+.02;tone(hz('E4'),t,.15,{type:'square',vol:.06});tone(hz('C4'),t+.16,.25,{type:'square',vol:.06})};
const blip=n=>{audio();bell(n,ctx.currentTime+.02,.3,.25)};
function introSound(){
 audio();const t=ctx.currentTime+.05;
 const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
 o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(36,t+1.1);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.9,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.7);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+1.8);
 const len=ctx.sampleRate*1.3|0,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
 const ns=ctx.createBufferSource(),f=ctx.createBiquadFilter(),ng=ctx.createGain();ns.buffer=buf;
 f.type='bandpass';f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(5000,t+1.2);ng.gain.value=.3;
 ns.connect(f);f.connect(ng);ng.connect(master);ns.start(t);
 ['C6','E6','G6','C7','E7','G7','C8'].forEach((n,i)=>tone(hz(n),t+.95+i*.065,.3,{type:'sine',vol:.1}));
 ['C3','G3','C4','E4','G4','C5'].forEach(n=>{
  const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.value=hz(n);
  lp.type='lowpass';lp.frequency.setValueAtTime(300,t+1.3);lp.frequency.exponentialRampToValueAtTime(3500,t+2.5);
  g.gain.setValueAtTime(.0001,t+1.3);g.gain.exponentialRampToValueAtTime(.06,t+1.6);g.gain.exponentialRampToValueAtTime(.0001,t+3.8);
  o.connect(lp);lp.connect(g);g.connect(master);o.start(t+1.3);o.stop(t+3.9);
 });
}

/* ---------- voice ---------- */
let voice=null;const hasTTS='speechSynthesis' in window;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en[-_](CA|US)/i.test(v.lang)&&/Samantha|Karen|Tessa|Moira|Female|Ava|Allison/i.test(v.name))||vs.find(v=>/^en[-_](CA|US)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){return new Promise(res=>{
 if(!hasTTS||!text)return res();
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.rate=.88;u.pitch=1.15;
 let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,1500+text.length*85);
})}

/* ---------- song ---------- */
const SONG=[
 {text:'The itsy bitsy spider climbed up the water spout',scene:'climb',notes:parse('G4 1,C5 2,C5 1,C5 2,D5 1,E5 3,E5 2,E5 1,D5 2,C5 1,D5 2,E5 1,C5 6'),bass:parse('C3 1,C3 6,C3 6,G2 6,C3 6')},
 {text:'Down came the rain and washed the spider out',scene:'rain',notes:parse('E5 3,E5 2,F5 1,G5 5,G5 1,F5 2,E5 1,F5 2,G5 1,E5 6'),bass:parse('C3 6,C3 6,G2 6,C3 6')},
 {text:'Out came the sun and dried up all the rain',scene:'sun',notes:parse('C5 3,C5 2,D5 1,E5 5,E5 1,D5 2,C5 1,D5 2,E5 1,C5 6'),bass:parse('F2 6,C3 6,G2 6,C3 6')},
 {text:'And the itsy bitsy spider climbed up the spout again',scene:'climb2',notes:parse('G4 1,G4 1,C5 2,C5 1,C5 2,D5 1,E5 3,E5 2,E5 1,D5 2,C5 1,D5 2,E5 1,C5 8'),bass:parse('C3 2,C3 6,C3 6,G2 6,C3 8')}
];
const UNIT=.17;
const rain=$('#rain');for(let i=0;i<46;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.animationDelay=(-Math.random()*.7)+'s';rain.appendChild(d)}
const climber=$('#climber');
function place(b,ms=0,ease='linear'){climber.style.transition=ms?`bottom ${ms}ms ${ease}`:'none';climber.style.bottom=b+'vh';if(!ms)void climber.offsetWidth}
async function phrase(i){
 const p=SONG[i],sun=$('#sun'),words=p.text.split(' '),ly=$('#lyric');
 ly.innerHTML=words.map(w=>`<span class="w">${w}</span>`).join(' ');
 climber.className='climber';
 if(p.scene==='climb'||p.scene==='climb2'){rain.classList.remove('on');if(p.scene==='climb')sun.classList.remove('up');place(10)}
 if(p.scene==='rain'){sun.classList.remove('up');place(62)}
 if(p.scene==='sun'){place(10);rain.classList.remove('on')}
 const dur=playNotes(p.notes,UNIT,p.bass)*1000;
 if(p.scene.startsWith('climb')){climber.classList.add('wig');requestAnimationFrame(()=>place(p.scene==='climb'?62:68,dur*.9))}
 if(p.scene==='rain'){rain.classList.add('on');setTimeout(()=>{climber.style.transition='bottom 1.1s cubic-bezier(.6,0,.9,.6)';climber.style.bottom='10vh'},dur*.45)}
 if(p.scene==='sun'){setTimeout(()=>sun.classList.add('up'),150);climber.classList.add('happy')}
 const spans=ly.querySelectorAll('.w');
 spans.forEach((s,k)=>setTimeout(()=>{spans.forEach(x=>x.classList.remove('now'));s.classList.add('now')},k*dur/words.length));
 await wait(dur+250);
}
async function sing(parts){
 if(hasTTS)speechSynthesis.cancel();
 $('#show').classList.add('on');
 for(const i of parts)await phrase(i);
 await wait(300);$('#show').classList.remove('on');
}

/* ---------- letters ---------- */
const WORDS='A apple 🍎|B bear 🐻|C cat 🐱|D dog 🐶|E egg 🥚|F fish 🐟|G goat 🐐|H hat 🎩|I inchworm 🐛|J juice 🧃|K kite 🪁|L lion 🦁|M moon 🌙|N nose 👃|O octopus 🐙|P pig 🐷|Q queen 👸|R rabbit 🐰|S sun ☀️|T turtle 🐢|U umbrella ☂️|V van 🚐|W whale 🐳|X x-ray 🩻|Y yo-yo 🪀|Z zebra 🦓'.split('|').map(s=>{const[L,w,e]=s.split(' ');return{L,w,e}});
const NAME={A:'ay',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'jee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'el',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zed'};
const SOUND={A:'ah',B:'buh',C:'kuh',D:'duh',E:'eh',F:'fuh',G:'guh',H:'huh',I:'ih',J:'juh',K:'kuh',L:'luh',M:'mmm',N:'nnn',O:'aw',P:'puh',Q:'kwuh',R:'ruh',S:'sss',T:'tuh',U:'uh',V:'vuh',W:'wuh',X:'ks',Y:'yuh',Z:'zzz'};
const letterBtn=L=>`${L}<small>${L.toLowerCase()}</small>`;

/* ---------- activities ---------- */
const bugSvg='<svg viewBox="0 0 60 60"><use href="#bug"/></svg>';
const ACT={
 seq:{title:'Spider Climb',make(){
  const max=store.max,down=Math.random()<.3,s=rand(0,max-3);
  let arr=[s,s+1,s+2,s+3];if(down)arr.reverse();
  const miss=rand(1,3),ans=arr[miss];
  const pool=shuffle([ans-2,ans-1,ans+1,ans+2].filter(v=>v>=0&&v<=max)).slice(0,2);
  const words=arr.map((v,i)=>i===miss?'hmmm':v).join(', ');
  return{answer:ans,choices:[ans,...pool].map(v=>({v,label:v})),
   html:`<div class="dir">${down?'Counting down ↓':'Counting up ↑'}</div><div class="beads">${arr.map((v,i)=>`<div class="bead${i===miss?' q':''}">${i===miss?'?':v}</div>`).join('')}</div>`,
   speak:`${down?'Counting down! ':''}${words}. ${miss===3?'What comes next?':'Which number is missing?'}`,
   reveal(){const q=$('.bead.q');q.textContent=ans;q.classList.add('done')},
   praise:`Yes! ${arr.join(', ')}!`};
 }},
 bugs:{title:'Ladybug Friends',make(){
  const max=store.max,op=any(['+1','+1','-1','-1','+0','-0']),n=rand(1,Math.min(max-1,15));
  const k=+op[1],plus=op[0]==='+',ans=plus?n+k:n-k;
  const alt=shuffle([ans+1,ans-1,ans+2].filter(v=>v>=0&&v!==ans)).slice(0,2);
  const friend=x=>x===1?'friend':'friends';
  const what={'+1':'One more friend comes!','-1':'One friend flies away!','+0':'Zero friends come.','-0':'Zero friends fly away.'}[op];
  return{answer:ans,choices:[ans,...alt].map(v=>({v,label:v})),
   html:`<div class="eq" id="eq">${n} ${plus?'+':'−'} <span class="k">${k}</span> = <span class="q">?</span></div><div class="web" id="web">${Array.from({length:n},()=>`<div>${bugSvg}</div>`).join('')}</div>`,
   speak:`Itsy has ${n} ladybug ${friend(n)}. ${what} How many ${friend(2)} now?`,
   anim(){const web=$('#web');if(!web)return;
    if(op==='+1'){const d=document.createElement('div');d.className='in';d.innerHTML=bugSvg;web.appendChild(d)}
    else if(op==='-1'){const last=web.lastElementChild;last.className='out';setTimeout(()=>last.style.visibility='hidden',950)}
    else $('#eq').classList.add('zero')},
   reveal(){$('#eq .q').textContent=ans},
   praise:k?`Yes! ${n} ${plus?'plus':'take away'} 1 is ${ans}!`:`Yes! ${plus?'Adding':'Taking away'} zero changes nothing. ${n} ${plus?'plus':'take away'} zero is ${ans}!`};
 }},
 letters:{title:'Letter Sounds',make(){
  const w=any(WORDS),L=w.L,others=shuffle(WORDS.map(x=>x.L).filter(x=>x!==L)).slice(0,2);
  const choices=[L,...others].map(v=>({v,label:letterBtn(v)}));
  if(Math.random()<.35)return{answer:L,choices,
   html:`<div class="ask">Find the letter!<button class="spk spkbig" data-say><svg><use href="#spk"/></svg></button></div>`,
   speak:`Find the letter ${NAME[L]}!`,
   reveal(){$('#stage').innerHTML=`<div class="pic">${w.e}</div><div class="word"><b>${L}</b>${w.w.slice(1)}</div>`},
   praise:`Yes! That's ${NAME[L]}. ${NAME[L]} is for ${w.w}!`};
  const S=SOUND[L];
  return{answer:L,choices,
   html:`<div class="pic">${w.e}</div><div class="word" id="word">&nbsp;</div>`,
   speak:`${w.w}! ${S}, ${S}, ${w.w}. Which letter makes the ${S} sound?`,
   reveal(){$('#word').innerHTML=`<b>${w.w[0].toUpperCase()}</b>${w.w.slice(1)}`},
   praise:`Yes! ${NAME[L]} says ${S}. ${NAME[L]} is for ${w.w}!`};
 }}
};

/* ---------- game flow ---------- */
const GOAL=4;let mode=null,score=0,busy=false,cur=null,songPart=0;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function stars(){$('#stars').textContent='★ '+store.stars}
const rail=$('#rail');
for(let i=1;i<=GOAL;i++){const n=document.createElement('i');n.className='notch';n.style.bottom=(7+i*19)+'%';rail.appendChild(n)}
const ritsy=document.createElement('div');ritsy.className='ritsy';ritsy.innerHTML='<svg viewBox="0 0 120 120"><use href="#itsy"/></svg>';rail.appendChild(ritsy);
function updRail(){ritsy.style.bottom=(2+score*19)+'%';rail.querySelectorAll('.notch').forEach((n,i)=>n.classList.toggle('got',i<score))}
function startGame(m){mode=m;score=0;busy=false;$('#gTitle').textContent=ACT[m].title;updRail();show('game');next()}
function next(){
 cur=ACT[mode].make();
 $('#stage').innerHTML=cur.html;
 $('#choices').innerHTML=shuffle(cur.choices).map(c=>`<button class="ch" data-v="${c.v}"><span>${c.label}</span></button>`).join('');
 say(cur.speak);
 if(cur.anim)setTimeout(cur.anim,1900);
}
async function choose(btn){
 if(busy||btn.classList.contains('wrong'))return;
 const v=btn.dataset.v;
 if(v===String(cur.answer)){
  busy=true;btn.classList.add('right');yay();cur.reveal&&cur.reveal();score++;updRail();
  await say(cur.praise);
  await sing([songPart%4]);songPart++;
  if(score>=GOAL)party();else{busy=false;next()}
 }else{btn.classList.add('wrong');oops();say(any(['Try again!','Oops! Try another one.','Almost! Try again.']))}
}
$('#choices').addEventListener('click',e=>{const b=e.target.closest('.ch');if(b)choose(b)});
$('#stage').addEventListener('click',e=>{if(e.target.closest('[data-say]')&&cur&&!busy)say(cur.speak)});
$('#again').addEventListener('click',()=>{if(cur&&!busy)say(cur.speak)});

const conf=$('#confetti'),COLS=['#ffd23f','#ff4f9a','#8fdcff','#58c96a','#ff6b4a','#fff'];
for(let i=0;i<60;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=COLS[i%6];c.style.animationDelay=(-Math.random()*3)+'s';c.style.animationDuration=(2.2+Math.random()*2)+'s';conf.appendChild(c)}
function party(){
 store.stars++;save();stars();$('#party').classList.add('on');
 audio();const t=ctx.currentTime+.05;['C5','E5','G5','C6','G5','C6'].forEach((n,i)=>bell(n,t+i*.12,i===5?.8:.12,.2));
 setTimeout(()=>say('You did it! You earned a star!'),900);
}
$('#pAgain').addEventListener('click',()=>{$('#party').classList.remove('on');startGame(mode)});
$('#pHome').addEventListener('click',()=>{$('#party').classList.remove('on');goHome()});

/* hold-to-leave buttons */
function goHome(){if(hasTTS)speechSynthesis.cancel();busy=false;stopAbc=true;show('home')}
function holdify(btn,fn){let t;
 const end=()=>{clearTimeout(t);btn.classList.remove('holding')};
 btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('holding');t=setTimeout(()=>{end();fn()},900)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,end));
}
holdify($('#gHome'),goHome);holdify($('#bHome'),goHome);

/* ---------- ABC board ---------- */
const TCOL=['#6b3fd1','#ff6b4a','#14a874','#ff4f9a','#2f9be0','#f5a300'];
const PENTA=['C5','D5','E5','G5','A5','C6','D6','E6','G6','A6'];
$('#letters').innerHTML=WORDS.map((w,i)=>`<button class="lt" data-i="${i}" style="background:${TCOL[i%6]}">${w.L}</button>`).join('');
const tiles=[...document.querySelectorAll('.lt')];
let abcBusy=false,stopAbc=false;
function cardFor(w){$('#card').innerHTML=`<b>${w.L}${w.L.toLowerCase()}</b><span class="pic">${w.e}</span><span class="word"><b style="font-size:inherit;color:var(--pink)">${w.L}</b>${w.w.slice(1)}</span>`}
$('#letters').addEventListener('click',e=>{
 const b=e.target.closest('.lt');if(!b||abcBusy)return;
 const i=+b.dataset.i,w=WORDS[i];blip(PENTA[i%10]);
 tiles.forEach(t=>t.classList.remove('lit'));b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),600);
 cardFor(w);say(`${NAME[w.L]}. ${SOUND[w.L]}, ${SOUND[w.L]}, ${w.w}!`);
});
const ABC=[['A','C5 2'],['B','C5 2'],['C','G5 2'],['D','G5 2'],['E','A5 2'],['F','A5 2'],['G','G5 4'],
 ['H','F5 2'],['I','F5 2'],['J','E5 2'],['K','E5 2'],['L','D5 1'],['M','D5 1'],['N','D5 1'],['O','D5 1'],['P','C5 4'],
 ['Q','G5 2'],['R','G5 2'],['S','F5 4'],['T','E5 2'],['U','E5 2'],['V','D5 4'],
 ['W','G5 2,G5 2,F5 2'],['X','F5 2'],['Y','E5 2'],['and','E5 2'],['Z','D5 4'],
 ['Now I know my A B Cs','C5 2,C5 2,G5 2,G5 2,A5 2,A5 2,G5 4'],
 ["Next time won't you sing with me!",'F5 2,F5 2,E5 2,E5 2,D5 2,D5 2,C5 4']];
$('#abcSing').addEventListener('click',async()=>{
 if(abcBusy)return;abcBusy=true;stopAbc=false;$('#abcSing').disabled=true;if(hasTTS)speechSynthesis.cancel();
 const u=.2;audio();
 for(const[lab,ns]of ABC){
  if(stopAbc)break;
  const notes=parse(ns),dur=playNotes(notes,u);
  tiles.forEach(t=>t.classList.remove('lit'));
  if(lab.length===1){const i=lab.charCodeAt(0)-65;tiles[i].classList.add('lit');cardFor(WORDS[i])}
  else if(lab!=='and')$('#card').innerHTML=`<span class="cap">${lab}</span>`;
  await wait(dur*1000);
 }
 tiles.forEach(t=>t.classList.remove('lit'));abcBusy=false;$('#abcSing').disabled=false;
});

/* ---------- home + intro ---------- */
function lvl(){document.querySelectorAll('[data-max]').forEach(b=>b.classList.toggle('sel',+b.dataset.max===store.max))}
document.querySelectorAll('[data-max]').forEach(b=>b.addEventListener('click',()=>{store.max=+b.dataset.max;save();lvl();blip('G5')}));
document.querySelector('.tiles').addEventListener('click',async e=>{
 const t=e.target.closest('[data-go]');if(!t)return;const g=t.dataset.go;blip('C6');
 if(g==='board'){$('#card').innerHTML='<span class="cap">Tap any letter to hear it</span>';show('board');say('Tap a letter!')}
 else if(g==='sing'){await sing([0,1,2,3])}
 else startGame(g);
});
const beams=$('#beams'),BC=['#ff4f9a','#ffd23f','#8fdcff','#58c96a','#ff6b4a','#b18cff','#ffffff'];
BC.forEach((c,i)=>{const b=document.createElement('i');b.style.background=`linear-gradient(90deg,transparent,${c},transparent)`;b.style.setProperty('--r',(i*26-80)+'deg');b.style.setProperty('--d',(i*.07)+'s');beams.appendChild(b)});
async function intro(){
 const el=$('#intro');el.className='on';void el.offsetWidth;el.classList.add('play');introSound();
 await Promise.race([wait(3700),new Promise(r=>el.addEventListener('click',r,{once:true}))]);
 el.classList.add('out');show('home');await wait(480);el.className='';
}
$('#go').addEventListener('click',()=>{
 audio();
 if(hasTTS){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}
 intro();
});
$('#replay').addEventListener('click',intro);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx)ctx.resume()});
stars();lvl();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
